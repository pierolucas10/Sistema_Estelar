; Estelar · configuración PHP por directorio (cPanel / PHP-FPM la lee automáticamente).
; Se usa .user.ini en lugar de php_flag en .htaccess porque php_flag rompe el sitio con PHP-FPM.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
html_errors = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_only_cookies = 1
upload_max_filesize = 1M
post_max_size = 2M
max_execution_time = 60
memory_limit = 128M
default_charset = "UTF-8"
date.timezone = "America/Bogota"
